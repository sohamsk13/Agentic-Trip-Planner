[project]
name = "trip_planner"
version = "0.1.0"
description = "Trip-planner using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,google-genai]==1.9.3",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0,<0.116.0",
    "starlette>=0.40.0,<0.46.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
trip_planner = "trip_planner.main:run"
run_crew = "trip_planner.main:run"
trip_api = "trip_planner.api:run_server"
train = "trip_planner.main:train"
replay = "trip_planner.main:replay"
test = "trip_planner.main:test"
run_with_trigger = "trip_planner.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_planner"]

[tool.crewai]
type = "crew"
